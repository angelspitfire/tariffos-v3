name: Production Smoke Gate

on:
  deployment_status:

jobs:
  prod-smoke:
    name: Production Read-Only Sanity & Rollback Alert
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      PROD_URL: https://tariffos.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict HTTP read-only smoke gate
        run: pnpm smoke:e2e -- --url "$PROD_URL" --strict

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Run read-only Playwright production sanity check
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PROD_URL }}
        run: pnpm test:e2e:prod

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: apps/web/playwright-report
          retention-days: 7

      - name: Print immediate rollback instructions on failure
        if: failure()
        run: |
          echo "::error::Production smoke gate failed against $PROD_URL. Revert immediately with:"
          echo "pnpm dlx vercel rollback --yes"
