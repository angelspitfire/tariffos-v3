packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  '@assistant-ui/core': '^0.3.38'
  '@assistant-ui/store': '^0.3.25'
  '@jridgewell/resolve-uri': '3.1.2'
  'glob': '^14.0.2'
  'minimatch': '^11.0.1'
  'zod': '^4.6.6'
